# vm-intent on Linux with Docker: Postgres, a Temporal server backed by Postgres,
# the Temporal UI, the API, N workers and the web app.
#
#   cd deploy
#   cp .env.example .env          # then change the passwords
#   docker compose up -d --build
#   docker compose up -d --scale worker=6     # more workers, no restart of anything else
#
# Web app      http://<host>:8088
# API          http://<host>:8080   (https://<host>:8443 with HTTPS on: VMINTENT_API_PROFILES=api,tls)
# Temporal UI  http://<host>:8233
#
# This is a sandbox / single-host setup. For production, run Temporal with its Helm
# chart (or Temporal Cloud) and a managed Postgres; the api and worker images stay the same.

name: vm-intent

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: ${TEMPORAL_DB_PASSWORD:?set TEMPORAL_DB_PASSWORD in .env}
      VMINTENT_DB_PASSWORD: ${VMINTENT_DB_PASSWORD:?set VMINTENT_DB_PASSWORD in .env}
    # Temporal opens many connections; so do the workers.
    command: ["postgres", "-c", "max_connections=500", "-c", "shared_buffers=512MB"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init-vmintent.sh:/docker-entrypoint-initdb.d/init-vmintent.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  temporal:
    # auto-setup creates Temporal's tables on first start. Fine for a sandbox; for
    # production use temporalio/server and run the schema tool yourself.
    image: temporalio/auto-setup:${TEMPORAL_VERSION:-1.30.2}
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: temporal
      POSTGRES_PWD: ${TEMPORAL_DB_PASSWORD}
      POSTGRES_SEEDS: postgres
      # Shards are fixed when the cluster is first created. 512 leaves plenty of room
      # for thousands of workflows running at once.
      NUM_HISTORY_SHARDS: 512
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/dynamicconfig.yaml
    volumes:
      - ./temporal/dynamicconfig:/etc/temporal/config/dynamicconfig:ro
    ports:
      - "7233:7233"
    restart: unless-stopped   # the api and workers also restart until Temporal is reachable

  temporal-ui:
    image: temporalio/ui:${TEMPORAL_UI_VERSION:-2.40.0}
    depends_on: [temporal]
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    ports:
      - "8233:8080"
    restart: unless-stopped

  api:
    build: ../backend
    image: vm-intent-backend:latest
    depends_on:
      postgres: { condition: service_healthy }
      temporal: { condition: service_started }
    environment: &backend-env
      # "api,tls" serves HTTPS on 8443 and accepts client certificates (files in ./pki).
      SPRING_PROFILES_ACTIVE: ${VMINTENT_API_PROFILES:-api}
      TEMPORAL_ADDRESS: temporal:7233
      VMINTENT_DB_EMBEDDED: "false"
      VMINTENT_DB_URL: jdbc:postgresql://postgres:5432/vmintent
      VMINTENT_DB_USER: vmintent
      VMINTENT_DB_PASSWORD: ${VMINTENT_DB_PASSWORD}
      VMINTENT_DB_POOL: 20
      # AI interpreter (README "Using an AI"): none, anthropic, openai, azure-openai or ollama.
      VMINTENT_LLM_PROVIDER: ${VMINTENT_LLM_PROVIDER:-none}
      VMINTENT_LLM_MODEL: ${VMINTENT_LLM_MODEL:-}
      VMINTENT_LLM_URL: ${VMINTENT_LLM_URL:-}
      VMINTENT_LLM_API_KEY: ${VMINTENT_LLM_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # Sign-in (see docs/SECURITY.md): none, entra, pki or entra,pki.
      VMINTENT_SECURITY_MODE: ${VMINTENT_SECURITY_MODE:-none}
      VMINTENT_ENTRA_TENANT_ID: ${VMINTENT_ENTRA_TENANT_ID:-}
      VMINTENT_ENTRA_AUDIENCES: ${VMINTENT_ENTRA_AUDIENCES:-}
      VMINTENT_SWAGGER_CLIENT_ID: ${VMINTENT_SWAGGER_CLIENT_ID:-}
      # Client certificates: files in deploy/pki, mounted below.
      VMINTENT_TLS_CERT: /etc/vm-intent/pki/server.crt
      VMINTENT_TLS_KEY: /etc/vm-intent/pki/server.key
      VMINTENT_PKI_CA_FILE: /etc/vm-intent/pki/ca-bundle.pem
      VMINTENT_PKI_CLIENTS_FILE: /etc/vm-intent/pki/pki-clients.yml
      VMINTENT_PKI_CRL_FILE: ${VMINTENT_PKI_CRL_FILE:-}
      VMINTENT_PKI_HEADER: ${VMINTENT_PKI_HEADER:-}
      VMINTENT_PKI_TRUSTED_PROXIES: ${VMINTENT_PKI_TRUSTED_PROXIES:-}
      # Folders every backend container must share (catalog file store, simulated VM disks,
      # one-way link, history archive): one named volume, mounted at /data in all of them.
      VMINTENT_FILES_DIR: /data/files
      VMINTENT_TARGETS_DIR: /data/targets
      VMINTENT_LINK_OUTBOX: /data/link/outbox
      VMINTENT_LINK_INBOX: /data/link/inbox
      VMINTENT_ARCHIVE_DIR: /data/archive
    volumes:
      - ./pki:/etc/vm-intent/pki:ro
      - vmintent-data:/data
    ports:
      - "8080:8080"
      - "8443:8443"
    restart: unless-stopped

  worker:
    image: vm-intent-backend:latest
    depends_on:
      api: { condition: service_started }   # the api runs the database migrations first
    environment:
      <<: *backend-env
      SPRING_PROFILES_ACTIVE: worker
      VMINTENT_DB_POOL: 30
    volumes:
      - vmintent-data:/data
    deploy:
      replicas: ${WORKERS:-3}
      resources:
        limits: { memory: 2g }
    restart: unless-stopped

  web:
    build: ../frontend
    depends_on: [api]
    environment:
      # Where nginx forwards /api and the docs. With HTTPS on the API: https://api:8443
      API_UPSTREAM: ${VMINTENT_WEB_API_UPSTREAM:-http://api:8080}
    ports:
      - "8088:80"
    restart: unless-stopped

  # Optional local AI: docker compose --profile ollama up -d, then
  #   docker compose exec ollama ollama pull llama3.2
  # and set VMINTENT_LLM_PROVIDER=ollama, VMINTENT_LLM_URL=http://ollama:11434 in .env.
  # On a CPU-only machine small models (llama3.2, 3B) answer in seconds; larger ones are slow.
  ollama:
    image: ollama/ollama:${OLLAMA_VERSION:-latest}
    profiles: [ollama]
    volumes:
      - ollama:/root/.ollama
    restart: unless-stopped

volumes:
  pgdata:
  ollama:
  vmintent-data:
