# The REST API. It starts workflows but runs none (profile api), so it scales on its own.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vm-intent-api
  labels:
    app.kubernetes.io/name: vm-intent-api
    app.kubernetes.io/component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: vm-intent-api
  strategy:
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vm-intent-api
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: vm-intent
    spec:
      serviceAccountName: vm-intent
      # Running tasks finish before the pod goes (see GracefulWorkerShutdown); anything left is retried elsewhere.
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: vm-intent-api
      containers:
        - name: backend
          image: vm-intent-backend
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: vm-intent-config
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "api"
            - name: VMINTENT_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: vm-intent-secrets
                  key: db-password
          ports:
            - name: http
              containerPort: 8080
            - name: health
              containerPort: 8081
          startupProbe:
            httpGet:
              path: /healthz/live
              port: health
            periodSeconds: 5
            failureThreshold: 36       # up to 3 minutes to start
          livenessProbe:
            httpGet:
              path: /healthz/live
              port: health
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz/ready
              port: health
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 768Mi
            limits:
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: shared
              mountPath: /data
            - name: archive
              mountPath: /archive
      volumes:
        - name: tmp
          emptyDir: {}
        - name: shared
          persistentVolumeClaim:
            claimName: vm-intent-shared
        - name: archive
          persistentVolumeClaim:
            claimName: vm-intent-archive
---
apiVersion: v1
kind: Service
metadata:
  name: vm-intent-api
  labels:
    app.kubernetes.io/name: vm-intent-api
spec:
  selector:
    app.kubernetes.io/name: vm-intent-api
  ports:
    - name: http
      port: 8080
      targetPort: http
