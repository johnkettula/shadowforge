# vm-intent on Kubernetes: the API, the web app and the workers. Every worker runs on Kubernetes.
# Temporal and Postgres are not in here: use Temporal's Helm chart or Temporal Cloud, and a managed
# Postgres. See docs/KUBERNETES.md.
#
#   kubectl apply -k deploy/kubernetes/overlays/dev
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
labels:
  - pairs:
      app.kubernetes.io/part-of: vm-intent
    includeSelectors: false
resources:
  - serviceaccount.yaml
  - configmap.yaml
  - storage.yaml
  - api.yaml
  - web.yaml
  - worker-workflows.yaml
  - worker-clouds.yaml
  - autoscaling.yaml
  - disruption.yaml
images:
  - name: vm-intent-backend
    newName: registry.example.com/vm-intent/backend
    newTag: "2.1.0"
  - name: vm-intent-web
    newName: registry.example.com/vm-intent/web
    newTag: "2.1.0"
