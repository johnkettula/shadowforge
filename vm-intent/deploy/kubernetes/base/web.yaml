# The web app: static files and nginx, which forwards /api and the docs to the API.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vm-intent-web
  labels:
    app.kubernetes.io/name: vm-intent-web
    app.kubernetes.io/component: web
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: vm-intent-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vm-intent-web
        app.kubernetes.io/component: web
        app.kubernetes.io/part-of: vm-intent
    spec:
      serviceAccountName: vm-intent
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: vm-intent-web
          imagePullPolicy: IfNotPresent
          env:
            - name: API_UPSTREAM
              value: http://vm-intent-api:8080
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
---
apiVersion: v1
kind: Service
metadata:
  name: vm-intent-web
  labels:
    app.kubernetes.io/name: vm-intent-web
spec:
  selector:
    app.kubernetes.io/name: vm-intent-web
  ports:
    - name: http
      port: 80
      targetPort: http
