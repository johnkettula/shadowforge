# More worker pods when they're busy. Work is shared through Temporal's task queues, so adding a pod
# needs nothing else; removing one lets its running tasks finish first.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: vm-intent-worker-workflows
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: vm-intent-worker-workflows
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: vm-intent-worker-clouds
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: vm-intent-worker-clouds
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
