server {
    listen 80;
    root /usr/share/nginx/html;

    # The React app: unknown paths fall back to index.html.
    location / {
        try_files $uri /index.html;
    }

    # The backend API (the "api" service in docker-compose.yml).
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_read_timeout 120s;
        client_max_body_size 20m;   # big batches
    }

    # API documentation: OpenAPI JSON/YAML and Swagger UI, served by the API.
    location /v3/api-docs {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
    }
    location /swagger-ui {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
    }
}
