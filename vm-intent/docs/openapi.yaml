# Snapshot of the vm-intent OpenAPI document (sign-in off). The running server's /v3/api-docs is the source of truth.
openapi: 3.0.1
info:
  title: vm-intent API
  description: 'Request virtual machines on vSphere, AWS, Azure or Google Cloud, in plain English or as an exact spec.


    **How it works.** Every request becomes one canonical, cloud-neutral spec with a SHA-256 hash. The same spec can''t
    be built twice at once: the hash is the build''s identity. A Temporal workflow builds each VM and rolls it back (deletes
    it) if anything fails.


    **Typical flows**

    - *One VM, with a human in the loop:* `POST /api/v2/requests`, poll `GET /api/v2/requests/{id}`, then `/clarify`
    if it asks a question and `/confirm` to build.

    - *Many VMs from a service:* `POST /api/v2/batches` with specs or text, then poll `GET /api/v2/batches/{id}`. No
    confirmation step per VM.

    - *Check first:* `POST /api/v2/interpret` shows what a text would become, without building anything.


    **Optional fields.** Fields with no value are left out of responses rather than sent as null.


    **Errors.** Every 4xx and 5xx response has the body `{"error": "..."}`.


    **Sign-in.** Off on this server: restrict access at the network level. See the "Required role" on each operation
    for what applies when sign-in is on.

    '
  license:
    name: Internal use
  version: 2.0.0
servers:
- url: http://localhost:8080
  description: Local development. Replace with your deployment's address, or fetch /v3/api-docs from the running server.
tags:
- name: Requests
  description: 'One VM at a time: interpret, clarify, confirm, build'
- name: Batches
  description: Many VMs at once, no confirmation per VM
- name: Inventory
  description: VMs, counts and the audit trail
- name: Legacy
  description: The old universal JSON format (v1)
paths:
  /api/v2/vms/{specHash}/snapshot:
    post:
      tags:
      - VM lifecycle
      summary: Snapshot a VM
      description: 'Up to 20 snapshots per VM.


        **Required role:** REQUESTER (when sign-in is on; it is currently off)'
      operationId: snapshotVm
      parameters:
      - name: specHash
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SnapshotBody'
        required: true
      responses:
        '200':
          description: Snapshot taken; the new lifecycle
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VmLifecycle'
        '409':
          description: 'Refused: the VM isn''t in a state that allows this (the message says why)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '400':
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v2/vms/{specHash}/resize:
    post:
      tags:
      - VM lifecycle
      summary: Resize a VM
      description: 'Changes vCPU and memory. If the cloud refuses, nothing changes and the reason comes back (409).


        **Required role:** REQUESTER (when sign-in is on; it is currently off)'
      operationId: resizeVm
      parameters:
      - name: specHash
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResizeBody'
        required: true
      responses:
        '200':
          description: Resized; the new lifecycle
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VmLifecycle'
        '409':
          description: 'Refused: the VM isn''t in a state that allows this (the message says why)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '400':
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v2/vms/{specHash}/renew:
    post:
      tags:
      - VM lifecycle
      summary: Renew a VM
      description: 'Pushes the expiry back by 1 to 90 days (at most 365 days from today). A VM that never expires can''t
        be renewed.


        **Required role:** REQUESTER (when sign-in is on; it is currently off)'
      operationId: renewVm
      parameters:
      - name: specHash
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenewBody'
        required: true
      responses:
        '200':
          description: Renewed; the new lifecycle
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VmLifecycle'
        '409':
          description: 'Refused: the VM isn''t in a state that allows this (the message says why)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '400':
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v2/vms/{specHash}/power:
    post:
      tags:
      - VM lifecycle
      summary: Power a VM on or off
      description: 'Power a VM on or off


        **Required role:** REQUESTER (when sign-in is on; it is currently off)'
      operationId: powerVm
      parameters:
      - name: specHash
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PowerBody'
        required: true
      responses:
        '200':
          description: Done; the new lifecycle
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VmLifecycle'
        '409':
          description: 'Refused: the VM isn''t in a state that allows this (the message says why)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '400':
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v2/vms/{specHash}/decommission:
    post:
      tags:
      - VM lifecycle
      summary: Remove a VM now
      description: 'Deletes the VM from its cloud and marks it DELETED. This can''t be undone.


        **Required role:** REQUESTER (when sign-in is on; it is currently off)'
      operationId: decommissionVm
      parameters:
      - name: specHash
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DecommissionBody'
      responses:
        '200':
          description: Removed; the final lifecycle
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VmLifecycle'
        '409':
          description: 'Refused: the VM isn''t in a state that allows this (the message says why)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '400':
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v2/requests:
    get:
      tags:
      - Requests
      summary: List requests
      description: 'Newest first, filtered by any of: requester, state, provider, env. Uses Temporal search attributes;
        if the Temporal server doesn''t have them, filters are refused (400) and only the unfiltered list works. The
        state is the last one the request reported.


        **Required role:** READER (when sign-in is on; it is currently off)'
      operationId: listRequests
      parameters:
      - name: requester
        in: query
        description: Who made the request; "me" = the signed-in caller
        required: false
        schema:
          type: string
      - name: state
        in: query
        description: e.g. AWAITING_CONFIRMATION, COMPLETED
        required: false
        schema:
          type: string
      - name: provider
        in: query
        description: vsphere, aws, azure or gcp
        required: false
        schema:
          type: string
      - name: env
        in: query
        description: dev, test, staging or prod
        required: false
        schema:
          type: string
      - name: limit
        in: query
        description: Most to return (1-200)
        required: false
        schema:
          type: integer
          format: int32
          default: 50
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RequestSummary'
        '500':
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    post:
      tags:
      - Requests
      summary: Start a request
      description: 'Starts a request workflow for one VM. Poll GET /api/v2/requests/{id}: when state is AWAITING_CLARIFICATION,
        answer the question; when AWAITING_CONFIRMATION, confirm or cancel. Both waits time out after 24 hours.


        **Required role:** REQUESTER (when sign-in is on; it is currently off)'
      operationId: createRequest
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TextBody'
        required: true
      responses:
        '200':
          description: Started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmitResponse'
        '400':
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v2/requests/{id}/confirm:
    post:
      tags:
      - Requests
      summary: Confirm and build
      description: 'Use when state is AWAITING_CONFIRMATION, after the requester has checked the spec. Send the specHash
        you were shown to make sure it''s the spec being built. Answers with the request''s new status (PROVISIONING,
        or DUPLICATE if the VM already exists).


        **Required role:** REQUESTER (when sign-in is on; it is currently off)'
      operationId: confirmRequest
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmBody'
      responses:
        '200':
          description: Confirmed; the build has started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestStatus'
        '409':
          description: Not waiting for confirmation, or a different spec
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: No such request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Not your request (sign-in on, not an admin)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '400':
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v2/requests/{id}/clarify:
    post:
      tags:
      - Requests
      summary: Answer the request's question
      description: 'Use when state is AWAITING_CLARIFICATION.


        **Required role:** REQUESTER (when sign-in is on; it is currently off)'
      operationId: clarifyRequest
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnswerBody'
        required: true
      responses:
        '204':
          description: Answer delivered
        '404':
          description: No such request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Not your request (sign-in on, not an admin)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '400':
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v2/requests/{id}/cancel:
    post:
      tags:
      - Requests
      summary: Cancel a waiting request
      description: 'Has no effect once the build has started.


        **Required role:** REQUESTER (when sign-in is on; it is currently off)'
      operationId: cancelRequest
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Cancelled
        '404':
          description: No such request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Not your request (sign-in on, not an admin)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v2/inventory-checks:
    get:
      tags:
      - Inventory
      summary: Latest inventory checks
      description: 'Results of the nightly check (and any run by hand), newest first: VMs that disappeared from their
        cloud (now MISSING) and VMs in a cloud that nobody recorded (orphans; never deleted automatically). Clouds behind
        the one-way link are skipped.


        **Required role:** READER (when sign-in is on; it is currently off)'
      operationId: listInventoryChecks
      parameters:
      - name: limit
        in: query
        description: Most to return (1-50)
        required: false
        schema:
          type: integer
          format: int32
          default: 10
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InventoryReport'
        '500':
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    post:
      tags:
      - Inventory
      summary: Run the inventory check now
      description: 'Starts it straight away instead of waiting for the night. The result appears in GET /api/v2/inventory-checks
        when it finishes, usually within a minute.


        **Required role:** ADMIN (when sign-in is on; it is currently off)'
      operationId: runInventoryCheck
      responses:
        '202':
          description: Started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckStarted'
        '500':
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v2/interpret:
    post:
      tags:
      - Requests
      summary: Preview how a request is understood
      description: 'Turns plain English into the canonical spec and its hash, or returns the question it would ask. Starts
        nothing and builds nothing. Many wordings of the same VM give the same specHash.


        **Required role:** REQUESTER (when sign-in is on; it is currently off)'
      operationId: interpretRequest
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TextBody'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Interpretation'
        '400':
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v2/batches:
    post:
      tags:
      - Batches
      summary: Build many VMs at once
      description: 'Every item is checked before anything starts. Items that need a clarifying answer, or break policy,
        are returned in `rejected`; the rest are built with no confirmation step. An item identical to another (same
        spec hash) is built once. Poll GET /api/v2/batches/{id}.


        **Required role:** BATCH (when sign-in is on; it is currently off)'
      operationId: createBatch
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchBody'
        required: true
      responses:
        '202':
          description: Accepted; the batch has started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchSubmitResponse'
        '400':
          description: Empty, too large, or no item could be built
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/vms:
    post:
      tags:
      - Legacy
      summary: Create a VM from the legacy JSON format
      description: 'The old universal JSON definition. Skips interpretation and confirmation and goes straight to the
        build. Kept for existing callers; new callers should use /api/v2.


        **Required role:** BATCH (when sign-in is on; it is currently off)'
      operationId: createLegacyVm
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LegacyVmDefinition'
        required: true
      responses:
        '202':
          description: Accepted; the build has started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyAccepted'
        '400':
          description: Missing or invalid fields
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: An identical VM already exists or is being built
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v2/vms:
    get:
      tags:
      - Inventory
      summary: List VMs
      description: 'The 200 most recently changed VMs, newest first.


        **Required role:** READER (when sign-in is on; it is currently off)'
      operationId: listVms
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/VmRecord'
        '500':
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v2/vms/{specHash}/lifecycle:
    get:
      tags:
      - VM lifecycle
      summary: Get a VM's lifecycle
      description: 'Expiry date, whether the warning was sent, power, current size, snapshots and recent events. Live
        from the lifecycle workflow while the VM exists; from the inventory after it''s removed.


        **Required role:** READER (when sign-in is on; it is currently off)'
      operationId: getVmLifecycle
      parameters:
      - name: specHash
        in: path
        description: The VM's spec hash
        required: true
        schema:
          type: string
      responses:
        '200':
          description: The lifecycle
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VmLifecycle'
        '404':
          description: No such VM, or one built before lifecycles existed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v2/stats:
    get:
      tags:
      - Inventory
      summary: Count VMs by state
      description: 'Count VMs by state


        **Required role:** READER (when sign-in is on; it is currently off)'
      operationId: getStats
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatsResponse'
        '500':
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v2/requests/{id}:
    get:
      tags:
      - Requests
      summary: Get a request's status
      description: 'state is one of STARTING, INTERPRETING, AWAITING_CLARIFICATION, AWAITING_CONFIRMATION, PROVISIONING,
        COMPLETED, FAILED, CANCELLED, DUPLICATE, or BUSY (workers didn''t answer within 5 seconds; try again). The last
        four of the first list are final.


        **Required role:** READER (when sign-in is on; it is currently off)'
      operationId: getRequest
      parameters:
      - name: id
        in: path
        description: Request ID from POST /api/v2/requests
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Current status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestStatus'
        '404':
          description: No such request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v2/batches/{id}:
    get:
      tags:
      - Batches
      summary: Get a batch's progress
      description: 'Counted from the audit trail, so it answers immediately even while workers restart.


        **Required role:** READER (when sign-in is on; it is currently off)'
      operationId: getBatch
      parameters:
      - name: id
        in: path
        description: Batch ID from POST /api/v2/batches
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Current progress
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchStatus'
        '404':
          description: No such batch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v2/audit:
    get:
      tags:
      - Inventory
      summary: Read the audit trail
      description: 'Events for one request, batch or VM (spec hash or its first characters), oldest first. With no filter,
        the latest events overall.


        **Required role:** READER (when sign-in is on; it is currently off)'
      operationId: getAuditTrail
      parameters:
      - name: requestId
        in: query
        description: Request or batch ID
        required: false
        schema:
          type: string
      - name: specHash
        in: query
        description: Spec hash, or its first 8+ characters
        required: false
        schema:
          type: string
      - name: limit
        in: query
        description: Most events to return (1-500)
        required: false
        schema:
          type: integer
          format: int32
          default: 50
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AuditEvent'
        '500':
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
components:
  schemas:
    SnapshotBody:
      required:
      - label
      type: object
      properties:
        label:
          type: string
          description: Lowercase letters, digits and dashes, up to 40.
          example: before-upgrade
      description: Take a snapshot of a VM.
    ApiError:
      type: object
      properties:
        error:
          type: string
          description: What went wrong, in plain words.
          example: No batch batch-123
        workflowId:
          type: string
          description: The workflow involved, when there is one.
        rejected:
          type: array
          description: Rejected batch items, when a whole batch was refused.
          items:
            $ref: '#/components/schemas/Rejected'
      description: Error body returned with every 4xx and 5xx response.
    Rejected:
      type: object
      properties:
        index:
          type: integer
          description: Position in the submitted items list (0-based).
          format: int32
          example: 2
        reason:
          type: string
          description: Why, or the question that would need answering.
          example: 'Needs an answer: Which platform should this run on: vSphere (on-prem), AWS, Azure or Google Cloud?'
      description: A batch item that was not accepted.
    VmLifecycle:
      type: object
      properties:
        state:
          type: string
          enum:
          - ACTIVE
          - DECOMMISSIONING
          - DECOMMISSIONED
          - MISSING
        expiresAt:
          type: string
          description: When the VM is removed (ISO-8601), or empty if it never expires.
        expiresAtMs:
          type: integer
          description: Same as expiresAt, in epoch milliseconds; 0 = never.
          format: int64
        warned:
          type: boolean
          description: The expiry warning has been sent for the current expiry date.
        power:
          type: string
          enum:
          - 'ON'
          - 'OFF'
        vcpu:
          type: integer
          description: Current vCPU (after any resize).
          format: int32
        memoryGiB:
          type: integer
          description: Current memory in GiB (after any resize).
          format: int32
        snapshots:
          type: array
          description: Snapshots taken, newest last.
          items:
            type: string
            description: Snapshots taken, newest last.
        owner:
          type: string
          description: 'Who owns the VM: the person who asked for it.'
        history:
          type: array
          description: Timestamped lifecycle events, newest last (the last 50).
          items:
            type: string
            description: Timestamped lifecycle events, newest last (the last 50).
      description: 'A running VM''s life after the build: expiry, power, size, snapshots.'
    ResizeBody:
      required:
      - memoryGiB
      - vcpu
      type: object
      properties:
        vcpu:
          maximum: 64
          minimum: 1
          type: integer
          format: int32
          example: 4
        memoryGiB:
          maximum: 512
          minimum: 1
          type: integer
          format: int32
          example: 16
      description: A new size for a VM.
    RenewBody:
      required:
      - days
      type: object
      properties:
        days:
          type: integer
          description: Days to add (1-90). The new expiry can't be more than 365 days from today.
          format: int32
          example: 14
      description: Push a VM's expiry back.
    PowerBody:
      required:
      - 'on'
      type: object
      properties:
        'on':
          type: boolean
          description: true = on, false = off.
          example: false
      description: Power a VM on or off.
    DecommissionBody:
      type: object
      properties:
        reason:
          type: string
          description: Why, for the audit trail.
          example: Project finished
      description: Remove a VM now.
    TextBody:
      required:
      - text
      type: object
      properties:
        text:
          type: string
          description: What you want, in your own words.
          example: Ubuntu box, 4 cores, 16 gigs, us-east on AWS
        userId:
          type: string
          description: Who is asking. Recorded in the audit trail.
          example: jdoe
      description: A VM request in plain English.
    SubmitResponse:
      type: object
      properties:
        requestId:
          type: string
          description: ID to use with the other /requests endpoints.
          example: intent-3f2c9a1e-5b7d-4c1a-9e0f-2a6b8c4d1e7f
      description: A request was started.
    ConfirmBody:
      type: object
      properties:
        specHash:
          type: string
          description: The specHash you were shown. If given and it doesn't match, the confirmation is refused (409),
            so nobody confirms a spec they didn't see.
          example: 3af19a4e8492dc7edd60f92413fe0567546acd258f9c214eaebca7c4dd0d5d72
      description: Confirm the spec a request is waiting on.
    Interpretation:
      type: object
      properties:
        text:
          type: string
          description: The text that was interpreted.
        extractor:
          type: string
          description: Which interpreter was used.
          example: rules
        spec:
          $ref: '#/components/schemas/VmSpec'
        specHash:
          type: string
          description: SHA-256 of the canonical spec.
          example: 3af19a4e8492dc7edd60f92413fe0567546acd258f9c214eaebca7c4dd0d5d72
        summary:
          type: string
          description: One-line summary.
        assumptions:
          type: array
          description: Defaults that were filled in.
          items:
            type: string
            description: Defaults that were filled in.
        question:
          type: string
          description: Set when something must be answered before a spec can be built.
          example: 'Which platform should this run on: vSphere (on-prem), AWS, Azure or Google Cloud?'
        count:
          type: integer
          description: How many identical VMs were asked for. Left out when it's one.
          format: int32
          example: 3
      description: What a request was understood to mean. Either spec/specHash are set, or question is.
    RequestStatus:
      type: object
      properties:
        requestId:
          type: string
        state:
          type: string
          enum:
          - STARTING
          - INTERPRETING
          - AWAITING_CLARIFICATION
          - AWAITING_CONFIRMATION
          - PROVISIONING
          - COMPLETED
          - PARTIAL
          - FAILED
          - CANCELLED
          - DUPLICATE
          - BUSY
        message:
          type: string
          description: Human-readable status, or the question being asked.
        interpretation:
          $ref: '#/components/schemas/Interpretation'
        vm:
          $ref: '#/components/schemas/VmResult'
        history:
          type: array
          description: Timestamped steps so far.
          items:
            type: string
            description: Timestamped steps so far.
        requestedBy:
          type: string
          description: Who made the request.
          example: jdoe@example.com
        vms:
          type: array
          description: Every VM of a request for more than one (count > 1), in order.
          items:
            $ref: '#/components/schemas/VmResult'
      description: Where a request is, and what it understood.
    VmResult:
      type: object
      properties:
        vmId:
          type: string
          example: i-0b755f1ffc4e
        ipAddress:
          type: string
          example: 10.20.0.17
        provider:
          type: string
          example: aws
        nativeRegion:
          type: string
          example: us-east-1
        nativeSize:
          type: string
          example: m6i.xlarge
        nativeImage:
          type: string
          example: 'AMI lookup: ubuntu 24.04'
      description: The built VM, in the provider's own terms.
    VmSpec:
      type: object
      properties:
        name:
          type: string
          description: VM name. Generated from the hash if left empty.
          example: app-db-01
        provider:
          type: string
          example: aws
          enum:
          - vsphere
          - aws
          - azure
          - gcp
        region:
          type: string
          description: 'Cloud regions: us-east, us-west, us-central, eu-west. vSphere datacenters: dc1, dc2.'
          example: us-east
          enum:
          - us-east
          - us-west
          - us-central
          - eu-west
          - dc1
          - dc2
        vcpu:
          maximum: 64
          minimum: 1
          type: integer
          format: int32
          example: 4
        memoryGiB:
          maximum: 512
          minimum: 1
          type: integer
          format: int32
          example: 16
        os:
          type: string
          example: ubuntu
          enum:
          - ubuntu
          - rhel
          - windows
          - debian
          - rocky
        osVersion:
          type: string
          example: '24.04'
        diskGiB:
          maximum: 4096
          minimum: 10
          type: integer
          description: Windows needs at least 64.
          format: int32
          example: 100
        diskTier:
          type: string
          example: ssd
          enum:
          - ssd
          - standard
        env:
          type: string
          example: dev
          enum:
          - dev
          - test
          - staging
          - prod
        ttlDays:
          maximum: 365
          minimum: 0
          type: integer
          description: Lifetime in days; 0 = never expires.
          format: int32
          example: 14
        publicIp:
          type: boolean
          example: false
      description: The canonical, cloud-neutral VM spec. Its SHA-256 (specHash) is the VM's identity.
    AnswerBody:
      required:
      - answer
      type: object
      properties:
        answer:
          type: string
          description: The answer, in plain words.
          example: azure
      description: An answer to the question a request is waiting on.
    CheckStarted:
      type: object
      properties:
        checkId:
          type: string
          example: inventory-check-manual-1792800000000
      description: An inventory check was started.
    BatchBody:
      required:
      - items
      type: object
      properties:
        items:
          type: array
          description: 1 to 10,000 items.
          items:
            $ref: '#/components/schemas/BatchItemBody'
        shardSize:
          type: integer
          description: VMs per shard workflow (1-1000).
          format: int32
          example: 500
          default: 500
        maxInFlightPerShard:
          type: integer
          description: VMs one shard builds at the same time (1 to shardSize).
          format: int32
        requestedBy:
          type: string
          description: Who is asking. Recorded in the audit trail.
          example: provisioning-service
      description: Many VMs in one request. No confirmation step per VM.
    BatchItemBody:
      type: object
      properties:
        text:
          type: string
          description: Plain-English request. Rejected if it would need a clarifying question.
          example: small rhel 9 box on prem in dc1 for 2 weeks
        spec:
          $ref: '#/components/schemas/VmSpec'
      description: 'One VM in a batch: either plain text or an exact spec (give one of the two).'
    BatchSubmitResponse:
      type: object
      properties:
        batchId:
          type: string
          example: batch-7d1e0c2a-9b4f-4e6a-8c3d-1f2e3a4b5c6d
        accepted:
          type: integer
          description: Items that will be built.
          format: int32
          example: 1998
        sameInBatch:
          type: integer
          description: Items identical to an earlier item in the same batch (built once).
          format: int32
          example: 0
        rejected:
          type: array
          description: Items not accepted, with the reason.
          items:
            $ref: '#/components/schemas/Rejected'
        shards:
          type: integer
          description: Shard workflows the batch was split into.
          format: int32
          example: 4
      description: A batch was accepted and started.
    Disk:
      type: object
      properties:
        sizeGb:
          type: integer
          format: int32
          example: 80
        type:
          type: string
          example: SSD
    Image:
      type: object
      properties:
        os:
          type: string
          example: Debian
        version:
          type: string
          example: '12'
    LegacyVmDefinition:
      type: object
      properties:
        name:
          type: string
          example: legacy-web-01
        cloud:
          type: string
          description: AWS, Azure, GCP or vSphere.
          example: GCP
        location:
          type: string
          description: Provider region name or datacenter.
          example: us-central1
        cpu:
          type: integer
          format: int32
          example: 2
        ramGb:
          type: integer
          format: int32
          example: 8
        image:
          $ref: '#/components/schemas/Image'
        disk:
          $ref: '#/components/schemas/Disk'
        environment:
          type: string
          example: test
        ttlDays:
          type: integer
          format: int32
          example: 14
        publicIp:
          type: boolean
          example: false
      description: The legacy universal VM definition (v1). Provider-native names are accepted.
    LegacyAccepted:
      type: object
      properties:
        workflowId:
          type: string
          description: 'Temporal workflow ID: vm- plus the spec hash.'
        specHash:
          type: string
          description: SHA-256 of the canonical spec.
        spec:
          $ref: '#/components/schemas/VmSpec'
        summary:
          type: string
          description: One-line summary of the spec.
      description: A legacy JSON definition was accepted and its build started.
    VmRecord:
      type: object
      properties:
        specHash:
          type: string
        spec:
          $ref: '#/components/schemas/VmSpec'
        state:
          type: string
          enum:
          - PROVISIONING
          - RUNNING
          - FAILED
          - DELETED
          - MISSING
        detail:
          type: string
          description: Provider plan, or why it failed.
        result:
          $ref: '#/components/schemas/VmResult'
        updatedAt:
          type: string
          description: ISO-8601 time of the last change.
        lifecycle:
          $ref: '#/components/schemas/VmLifecycle'
      description: One VM in the inventory.
    StatsResponse:
      type: object
      properties:
        vmsByState:
          type: object
          additionalProperties:
            type: integer
            description: Number of VMs in each state.
            format: int64
          description: Number of VMs in each state.
          example:
            RUNNING: 1980
            FAILED: 20
      description: Inventory counts.
    RequestSummary:
      type: object
      properties:
        requestId:
          type: string
          example: intent-3f2c9a1e-5b7d-4c1a-9e0f-2a6b8c4d1e7f
        state:
          type: string
          description: Last state the request reported.
          example: AWAITING_CONFIRMATION
        requestedBy:
          type: string
          example: jdoe
        provider:
          type: string
          example: aws
        env:
          type: string
          example: dev
        specHash:
          type: string
        startedAt:
          type: string
          description: ISO-8601 start time.
        closedAt:
          type: string
          description: ISO-8601 end time, or empty while it runs.
        workflowStatus:
          type: string
          description: 'Temporal''s own status: RUNNING, COMPLETED, FAILED, TIMED_OUT, ...'
          example: RUNNING
      description: One request in a list.
    InventoryFinding:
      type: object
      properties:
        provider:
          type: string
        note:
          type: string
        recordedRunning:
          type: integer
          format: int32
        inCloud:
          type: integer
          format: int32
        missing:
          type: array
          items:
            type: string
        orphans:
          type: array
          items:
            type: string
    InventoryReport:
      type: object
      properties:
        checkId:
          type: string
        startedAt:
          type: string
        finishedAt:
          type: string
        missingCount:
          type: integer
          description: VMs marked MISSING by this check.
          format: int32
        orphanCount:
          type: integer
          description: VMs in a cloud with no record here (reported, not deleted).
          format: int32
        findings:
          type: array
          items:
            $ref: '#/components/schemas/InventoryFinding'
      description: The result of one inventory check.
    BatchStatus:
      type: object
      properties:
        batchId:
          type: string
        state:
          type: string
          enum:
          - RUNNING
          - COMPLETED
        total:
          type: integer
          description: VMs accepted into the batch.
          format: int64
        shardSize:
          type: integer
          format: int64
        started:
          type: integer
          description: VMs whose build has started.
          format: int64
        inFlight:
          type: integer
          description: Started but not finished.
          format: int64
        running:
          type: integer
          description: Built and running.
          format: int64
        failed:
          type: integer
          description: Failed and rolled back (deleted).
          format: int64
        duplicate:
          type: integer
          description: Not built because an identical VM already exists or is being built.
          format: int64
        p50Seconds:
          type: number
          description: Median seconds from submit to running.
          format: double
        p95Seconds:
          type: number
          description: 95th percentile seconds from submit to running.
          format: double
        maxSeconds:
          type: number
          description: Slowest VM, seconds from submit to running.
          format: double
        startedAtMs:
          type: integer
          description: When the batch was submitted (epoch milliseconds).
          format: int64
        finishedAtMs:
          type: integer
          description: When the batch finished (epoch milliseconds), or null.
          format: int64
        failures:
          type: array
          description: Up to 20 failure reasons.
          items:
            type: string
            description: Up to 20 failure reasons.
      description: Live progress of a batch, counted from the audit trail.
    AuditEvent:
      type: object
      properties:
        id:
          type: integer
          format: int64
        at:
          type: string
          description: ISO-8601 time.
        requestId:
          type: string
          description: Request or batch ID.
        specHash:
          type: string
        event:
          type: string
          description: REQUESTED, QUESTION_ASKED, ANSWERED, INTERPRETED, CONFIRMED, PROVISIONING, VM_CREATED, RUNNING,
            ROLLED_BACK, DUPLICATE, COMPLETED, FAILED, CANCELLED, BATCH_STARTED, BATCH_COMPLETED
          example: RUNNING
        actor:
          type: string
          description: A user ID, system, or legacy-api.
          example: system
        detail:
          type: string
      description: One thing that happened, in order.
