server:
  port: ${PORT:8080}

spring:
  application:
    name: vm-intent
  autoconfigure:
    # No built-in username/password user: callers sign in with Entra ID tokens (or not at all).
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  jackson:
    # API responses leave out fields that have no value, instead of sending null.
    default-property-inclusion: non_null
  temporal:
    connection:
      # Local: the dev server from "temporal server start-dev". Linux/Docker: set TEMPORAL_ADDRESS.
      target: ${TEMPORAL_ADDRESS:127.0.0.1:7233}
    namespace: ${TEMPORAL_NAMESPACE:default}
    # Finds every @WorkflowImpl / @ActivityImpl class in this package and
    # starts a worker for each task queue they name.
    workers-auto-discovery:
      packages: com.example.vmintent
    # Workflows waiting on a timer stay in memory so they don't have to be replayed
    # when they wake up. Sized for a few thousand builds per worker process.
    workflow-cache:
      max-instances: ${VMINTENT_WORKFLOW_CACHE:4000}
      max-threads: ${VMINTENT_WORKFLOW_THREADS:4000}
      using-virtual-workflow-threads: true

  # Used only when vmintent.db.embedded is false (a normal Postgres server, e.g. on Linux).
  datasource:
    url: ${VMINTENT_DB_URL:jdbc:postgresql://localhost:5432/vmintent}
    username: ${VMINTENT_DB_USER:vmintent}
    password: ${VMINTENT_DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${VMINTENT_DB_POOL:30}
  flyway:
    enabled: true          # creates and upgrades the tables from db/migration

vmintent:
  db:
    # true = the app runs its own Postgres (no install needed). Good for one PC.
    # false = use spring.datasource above. Needed when several processes share one database.
    embedded: ${VMINTENT_DB_EMBEDDED:true}
    embedded-port: 54329
    embedded-data-dir: ${user.home}/.vm-intent/pgdata
  # The interpreter that turns words into a spec. With an AI provider, the built-in rules still
  # answer whenever the AI can't (down, slow, bad reply), and each result names which one answered.
  llm:
    # none (built-in rules, offline) | anthropic | openai | azure-openai | ollama (free, local)
    provider: ${VMINTENT_LLM_PROVIDER:none}
    # Empty = the provider's default: anthropic claude-sonnet-5-5, ollama llama3.2.
    # openai: a model name; azure-openai: your deployment name.
    model: ${VMINTENT_LLM_MODEL:}
    # Empty = the provider's default address. Needed for azure-openai (https://<resource>.openai.azure.com),
    # Ollama on another machine (http://gpu-box:11434) or any other OpenAI-compatible service (.../v1).
    url: ${VMINTENT_LLM_URL:}
    # Empty = ANTHROPIC_API_KEY, OPENAI_API_KEY or AZURE_OPENAI_API_KEY. Ollama needs none.
    api-key: ${VMINTENT_LLM_API_KEY:}
    # 0 = 30 s, or 120 s for Ollama (local models are slow to load the first time).
    timeout-seconds: ${VMINTENT_LLM_TIMEOUT_SECONDS:0}

  # How much work each worker process takes on. See config/WorkerTuning.java.
  workers:
    # Task queues this process works on, comma-separated (intent-q, aws-q, aws-read-q, ...). Empty = all.
    # On Kubernetes each kind of pod gets its own (deploy/kubernetes).
    queues: ${VMINTENT_WORKER_QUEUES:}
    virtual-threads: true
    intent:
      max-workflow-tasks: 200     # workflow steps run at once, per process
      workflow-pollers: 16
      max-activities: 200         # database writes (inventory, audit) at once, per process
      activity-pollers: 8
    provider:
      max-activities: 100         # cloud calls at once, per process, per queue
      activity-pollers: 4
    # Calls per second to each cloud, across ALL worker processes together.
    rate:
      aws:     { create-per-second: 25, read-per-second: 100 }
      # Azure allows about 500 VM creates a minute per subscription and region (after a 1,500 burst).
      azure:   { create-per-second: 8, read-per-second: 100 }
      gcp:     { create-per-second: 25, read-per-second: 100 }
      vsphere: { create-per-second: 15, read-per-second: 60 }

  # The simulated clouds (see provider/SimCloud.java).
  sim:
    boot-min-seconds: ${VMINTENT_SIM_BOOT_MIN:20}
    boot-max-seconds: ${VMINTENT_SIM_BOOT_MAX:60}
    api-latency-ms: ${VMINTENT_SIM_LATENCY_MS:250}
    throttle-rate: ${VMINTENT_SIM_THROTTLE:0.02}   # share of cloud calls refused as "throttled"

  # vSphere: simulated (the default), vCenter 9 directly, or VCF Automation 9 blueprints. See docs/VSPHERE.md.
  vsphere:
    # simulated | vcenter | vcf-automation, for every datacenter without its own route below.
    route: ${VMINTENT_VSPHERE_ROUTE:simulated}
    vcenter:
      url: ${VMINTENT_VCENTER_URL:}                 # https://vcenter.example.com
      username: ${VMINTENT_VCENTER_USER:}           # e.g. svc-vmintent@vsphere.local
      password: ${VMINTENT_VCENTER_PASSWORD:}
      ca-file: ${VMINTENT_VCENTER_CA_FILE:}         # PEM with vCenter's CA; empty = the JVM's trusted CAs
      content-library: ${VMINTENT_VCENTER_LIBRARY:vm-intent-templates}
      tag-category: vm-intent                      # VMs vm-intent builds are tagged vm-intent/managed
      tag: managed
      timeout-seconds: 20
    automation:
      url: ${VMINTENT_VCFA_URL:}                    # https://vcfa.example.com
      org: ${VMINTENT_VCFA_ORG:}                    # the VM Apps organization (tenant) name
      api-token: ${VMINTENT_VCFA_API_TOKEN:}        # My Account > API Tokens
      auth: ${VMINTENT_VCFA_AUTH:tenant-oauth}      # tenant-oauth (VCF Automation 9) | iaas-login (Aria Automation 8.x)
      ca-file: ${VMINTENT_VCFA_CA_FILE:}
      project: ${VMINTENT_VCFA_PROJECT:}            # project name or ID
      api-version: "2019-09-12"
    # One entry per vm-intent datacenter (the spec's region). Examples (fill in your own names):
    # datacenters:
    #   dc1:
    #     route: vcenter
    #     datacenter: Datacenter-1
    #     cluster: Cluster-A                         # or resource-pool: / host:
    #     folder: vm-intent
    #     datastores: { ssd: vsanDatastore, standard: nfs-datastore-01 }
    #     templates: { ubuntu-24.04: tpl-ubuntu-2404, rhel-9: tpl-rhel-9, windows-2022: tpl-win2022 }
    #     customization-specs: { ubuntu: linux-dhcp, rhel: linux-dhcp, windows: windows-dhcp }
    #   dc2:
    #     route: vcf-automation
    #     blueprint: vm-intent-standard              # or per OS: blueprints: { windows: win-server }
    #     blueprint-version: ""                      # empty = the newest released version
    #     blueprint-inputs: { cpuCount: "{vcpu}", totalMemoryMB: "{memoryMiB}", image: "{os}-{osVersion}", diskGB: "{diskGiB}", env: "{env}" }

  # Azure Resource Manager (provider/azure). Azure requests are still simulated; this is the client the
  # real Azure route will use. The IDs and the secret come only from the environment. See docs/AZURE.md.
  azure:
    tenant-id: ${VMINTENT_AZURE_TENANT_ID:}
    client-id: ${VMINTENT_AZURE_CLIENT_ID:}               # the service principal's application (client) ID
    client-secret: ${VMINTENT_AZURE_CLIENT_SECRET:}
    subscription-id: ${VMINTENT_AZURE_SUBSCRIPTION_ID:}
    resource-group: ${VMINTENT_AZURE_RESOURCE_GROUP:}
    location: ${VMINTENT_AZURE_LOCATION:}                 # e.g. westeurope
    login-url: https://login.microsoftonline.com
    management-url: https://management.azure.com
    timeout-seconds: 30
    # For AzureArmBackend's Linux VMs (provider/azure/AzureVmProperties.java). The SSH key is a public key only.
    subnet-id: ${VMINTENT_AZURE_SUBNET_ID:}               # full ARM ID of an existing subnet
    admin-username: ${VMINTENT_AZURE_ADMIN_USERNAME:azureuser}
    admin-ssh-public-key: ${VMINTENT_AZURE_ADMIN_SSH_PUBLIC_KEY:}

  # The one-way link to domain 3. See docs/ONE-WAY-LINK.md.
  link:
    # Clouds reached over the link instead of directly: comma-separated (aws,azure), or * for all.
    # Empty (the default) = call every cloud directly, as on a single PC.
    one-way-providers: ${VMINTENT_LINK_PROVIDERS:}
    # Orders are written here as files; the link software carries them to domain 3.
    outbox-dir: ${VMINTENT_LINK_OUTBOX:${user.home}/.vm-intent/link/outbox}
    # The return link drops domain 3's answers here. Every process with workers must see the same folders.
    inbox-dir: ${VMINTENT_LINK_INBOX:${user.home}/.vm-intent/link/inbox}
    # How long a build waits for domain 3's answer before giving up and undoing.
    reply-timeout-minutes: ${VMINTENT_LINK_REPLY_TIMEOUT:120}
    # Answer the orders here, as a pretend domain 3, to try the link on one PC.
    simulate-domain3: ${VMINTENT_LINK_SIMULATE:false}
    simulated-build-seconds: 8

  # The nightly check that every cloud still matches the inventory (a Temporal Schedule).
  inventory-check:
    enabled: ${VMINTENT_INVENTORY_CHECK:true}
    cron: "${VMINTENT_INVENTORY_CHECK_CRON:0 2 * * *}"     # minute hour day month weekday: 02:00 every day
    time-zone: ${VMINTENT_INVENTORY_CHECK_TZ:UTC}          # e.g. America/New_York

  # The catalog: operator-written definitions (YAML) and their runs. See docs/DEFINITIONS.md.
  catalog:
    # The file store the actions copy from (files.copy, tools.stage): stands in for MinIO or an SSH server.
    files-dir: ${VMINTENT_FILES_DIR:${user.home}/.vm-intent/files}
    # One folder per VM standing in for its disk (simulated VMs). Every worker must see the same folders.
    targets-dir: ${VMINTENT_TARGETS_DIR:${user.home}/.vm-intent/targets}

  # Audit: data classification, retention, the decision log and the history archive. See docs/AUDIT.md.
  audit:
    # Codes, their text and retention (1-5 years). Empty = the built-in placeholders C1, C3, C5.
    classifications-file: ${VMINTENT_CLASSIFICATIONS_FILE:}
    # The code used when neither a run nor its definition gives one. Empty = the file's "default".
    default-classification: ${VMINTENT_DEFAULT_CLASSIFICATION:}
    # Write-once archive of closed workflow histories (a persistent volume in Kubernetes).
    archive-dir: ${VMINTENT_ARCHIVE_DIR:${user.home}/.vm-intent/archive}
    # The sweep that archives closed histories and removes what is past its retention (a Temporal Schedule).
    sweep-enabled: ${VMINTENT_ARCHIVE_SWEEP:true}
    sweep-cron: "${VMINTENT_ARCHIVE_SWEEP_CRON:17 * * * *}"   # minute 17 of every hour
    sweep-lookback-days: 30
    # Log allowed GETs too (every decision). false = only changes and refusals.
    log-reads: ${VMINTENT_LOG_READS:true}

  # Decisions beyond the caller's role (resume, tear down, approve, publish). OPA is optional:
  # set its decision URL, e.g. http://opa:8181/v1/data/vmintent/allow, and both must allow.
  policy:
    opa-url: ${VMINTENT_OPA_URL:}

  # /healthz/live and /healthz/ready on this port, for Kubernetes probes (0 = off). Works in worker pods too.
  health:
    port: ${VMINTENT_HEALTH_PORT:0}

  # Tag requests with VmRequester, VmState, ... so they can be listed and filtered.
  # auto = set them up on the Temporal server if it allows; off = don't use them.
  search-attributes: ${VMINTENT_SEARCH_ATTRIBUTES:auto}

  # Sign-in for the REST API. See docs/SECURITY.md.
  security:
    mode: ${VMINTENT_SECURITY_MODE:none}          # none | entra | pki | entra,pki
    entra:
      tenant-id: ${VMINTENT_ENTRA_TENANT_ID:}
      # The API's application (client) ID and/or Application ID URI, comma-separated.
      audiences: ${VMINTENT_ENTRA_AUDIENCES:}
      # Optional overrides; empty = the tenant's standard issuers and signing keys.
      issuers: ${VMINTENT_ENTRA_ISSUERS:}
      jwk-set-uri: ${VMINTENT_ENTRA_JWKS_URI:}
      # Entra app role / scope value -> vm-intent role. Empty = VmIntent.Admin/Batch/Request/Read.
      role-map: {}
    # Client certificates (mode pki). See docs/SECURITY.md and deploy/pki/.
    pki:
      # Allowlist: which certificates may call and the role each gets. Re-read when it changes.
      clients-file: ${VMINTENT_PKI_CLIENTS_FILE:}
      # PEM file of the CAs (root and/or issuing) allowed to issue client certificates.
      trusted-ca-file: ${VMINTENT_PKI_CA_FILE:}
      # Optional PEM/DER file of CRLs; a revoked certificate is refused. Re-read when it changes.
      crl-file: ${VMINTENT_PKI_CRL_FILE:}
      # Optional: a TLS proxy in front of the API forwards the certificate in this header
      # (nginx: $ssl_client_escaped_cert). Accepted only from trusted-proxies (comma-separated).
      header: ${VMINTENT_PKI_HEADER:}
      trusted-proxies: ${VMINTENT_PKI_TRUSTED_PROXIES:}

  api:
    # Addresses other services should call, listed in the OpenAPI document (comma-separated).
    # Empty = the address the document was fetched from.
    server-urls: ${VMINTENT_API_SERVER_URLS:}
    # Other web pages allowed to call the API from a browser (CORS), comma-separated; patterns allowed.
    # The web app itself doesn't need an entry. Example: https://portal.example.com,https://*.example.org
    cors-origins: ${VMINTENT_CORS_ORIGINS:http://localhost:[*],http://127.0.0.1:[*]}
    version: 2.1.0

# OpenAPI (Swagger): /v3/api-docs (JSON), /v3/api-docs.yaml, /swagger-ui.html
springdoc:
  paths-to-match: /api/**
  api-docs:
    path: /v3/api-docs
    version: openapi_3_0   # 3.0 is accepted by more client generators and API gateways than 3.1
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    try-it-out-enabled: true
    # "Authorize" button: sign in with Entra ID from Swagger UI (needs a SPA app registration
    # with redirect URI <host>/swagger-ui/oauth2-redirect.html). See docs/SECURITY.md.
    oauth:
      client-id: ${VMINTENT_SWAGGER_CLIENT_ID:}
      use-pkce-with-authorization-code-grant: true
    display-request-duration: true
  default-produces-media-type: application/json

logging:
  level:
    io.temporal.internal.worker.Poller: WARN
    # Each retried cloud call (e.g. "throttled") would otherwise print a full stack trace.
    # Retries and final failures are still visible in the Temporal UI and the audit trail.
    io.temporal.internal.activity.ActivityTaskExecutors: ERROR
