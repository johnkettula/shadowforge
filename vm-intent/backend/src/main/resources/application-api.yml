# Profile "api": the REST API only. It starts workflows but runs none of them.
# Run it with SPRING_PROFILES_ACTIVE=api. Scale it separately from the workers.
spring:
  temporal:
    start-workers: false
vmintent:
  db:
    embedded: ${VMINTENT_DB_EMBEDDED:false}
server:
  # Behind nginx or a gateway: trust X-Forwarded-* so links in the API docs use the public address.
  forward-headers-strategy: framework
